<!DOCTYPE html>
<html>
<head>
    <title>Movie Booking</title>

    <style>
        body {
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        h1 {
            padding: 20px;
        }

        .container {
            padding: 20px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;
        }

        .movie-meta {
            font-size: 14px;
            color: #bbb;
        }
        select, button {
            padding: 8px;
            border-radius: 5px;
            border: none;
        }

        button {
            background: #e50914;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #b20710;
        }
        .book-btn {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            background: #e50914;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .book-btn:hover {
            background: #b20710;
        }
    </style>
</head>

<body>

<h1>🎬 Movies</h1>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
